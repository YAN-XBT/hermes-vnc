name: hermes-vnc
version: "0.2.4"
description: >-
  Computer-use backend that drives any machine reachable over VNC (RFB): the stock
  computer_use tool captures the remote screen and moves that machine's mouse and
  keyboard, so the agent can work on a second computer, a lab box or a cloud desktop
  with no Hermes process running on it. Select it with computer_use.backend: hermes-vnc
  and point computer_use.vnc.host at the target. VNC carries pixels only, so the backend
  runs in the screenshot lane: capture returns a PNG and no accessibility elements, and
  element-addressed actions (click-by-element, focus_app, set_value) report unsupported_action
  instead of guessing while list_apps / list_windows return empty lists.
author: YAN-XBT
license: MIT
homepage: https://github.com/YAN-XBT/hermes-vnc
requires_hermes: ">=0.23.0"
platforms:
  - linux
  - macos
  - windows
tags:
  - computer-use
  - vnc
  - remote-desktop
python_dependencies:
  - "vncdotool>=1.2,<2"
# The settings live in a core section, so Hermes has to be told this plugin reads them:
# without it every `hermes config get/set computer_use.vnc.*` answers
# "'computer_use.vnc.host' is not a recognized config key — Hermes may not read it".
config_keys:
  - "computer_use.vnc"
